<!DOCTYPE html>
<html>
<head>
    <title>Logs - TWSTK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">TWSTK Monitor</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/stocks">Stocks</a>
                <a class="nav-link" href="/daily-price">Daily Price</a>
                <a class="nav-link" href="/features">Features</a>
                <a class="nav-link" href="/top20">Top 20</a>
                <a class="nav-link active" href="/logs">Logs</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>System Logs</h1>
        <div class="mt-4">
            <h3>app.log (Last 100 lines)</h3>
            <pre class="bg-dark text-light p-3" style="max-height: 400px; overflow-y: scroll;">{{ app_log }}</pre>
        </div>
        <div class="mt-4 mb-5">
            <h3>cron.log (Last 100 lines)</h3>
            <pre class="bg-dark text-light p-3" style="max-height: 400px; overflow-y: scroll;">{{ cron_log }}</pre>
        </div>
    </div>
</body>
</html>
