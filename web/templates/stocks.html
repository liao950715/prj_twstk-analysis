<!DOCTYPE html>
<html>
<head>
    <title>Stocks - TWSTK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">TWSTK Monitor</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/stocks">Stocks</a>
                <a class="nav-link" href="/daily-price">Daily Price</a>
                <a class="nav-link" href="/features">Features</a>
                <a class="nav-link" href="/top20">Top 20</a>
                <a class="nav-link" href="/logs">Logs</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Stock Master (Latest 100)</h1>
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Market</th>
                    <th>Industry</th>
                    <th>Active</th>
                    <th>Updated</th>
                </tr>
            </thead>
            <tbody>
                {% for s in stocks %}
                <tr>
                    <td>{{ s.stock_id }}</td>
                    <td>{{ s.stock_name }}</td>
                    <td>{{ s.market_type }}</td>
                    <td>{{ s.industry }}</td>
                    <td>{{ s.is_active }}</td>
                    <td>{{ s.updated_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
